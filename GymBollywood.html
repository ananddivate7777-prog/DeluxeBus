<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deluxe Library</title>

    <link rel="stylesheet" href="style.css">

    <!-- Tera existing stuff -->

    <style>
        /* ENERGY PLAYLIST - DISCO LIGHT */

        body::after {
            content: "";
            position: fixed;
            inset: 0;

            pointer-events: none;
            z-index: 2;

            background:
                radial-gradient(circle at 15% 20%,
                    rgba(255, 0, 100, 0.35),
                    transparent 25%),

                radial-gradient(circle at 85% 25%,
                    rgba(0, 200, 255, 0.35),
                    transparent 25%),

                radial-gradient(circle at 50% 80%,
                    rgba(255, 220, 0, 0.3),
                    transparent 25%),

                radial-gradient(circle at 20% 80%,
                    rgba(150, 0, 255, 0.3),
                    transparent 25%);

            mix-blend-mode: screen;

            animation: discoLights 4s ease-in-out infinite alternate;
        }

        @keyframes discoLights {

            0% {
                transform: scale(1);
                filter: blur(5px);
                opacity: 0.55;
            }

            50% {
                transform: scale(1.15) translate(-3%, 3%);
                opacity: 0.8;
            }

            100% {
                transform: scale(1.2) translate(2%, -3%);
                opacity: 0.6;
            }
        }
    </style>

</head>

<body>

    <img src="DeluxeLogo.jpeg" alt="Deluxe Library" class="deluxe-logo">

    <div class="playlist-dropdown">
    <button class="playlist-btn" onclick="togglePlaylistMenu()">
        ♫ Energy - Bollywood
        <span>▾</span>
    </button>

    <div class="playlist-menu" id="playlistMenu">
    <a href="index.html">♪ Old Vibe</a>
    <a href="OldLofi.html">♡ Bollywood Old - Lofi</a>
    <a href="Arijit.html">♪ Arijit Singh</a>
    <a href="Rahman.html">♪ A. R. Rahman</a>
    <a href="HoneySingh.html">♬ Yo Yo Honey Singh</a>
    <a href="Lofi.html">◌ Lofi Vibes</a>
    <a href="Gym.html">♨ Gym Energy - Beats</a>
    <a href="GymBollywood.html">♫ Energy / Fun - Bollywood</a>
    <a href="Sad.html">♢ Sad Songs</a>
</div>
</div>

    <!-- BACKGROUND IMAGE -->
<img src="energy.png" alt="Deluxe Dhaba" class="bg-image">

    <div class="overlay"></div>


    <!-- MAIN CONTENT -->
    <main class="main-container">

        <section class="hero">

            <h1>
                MOOD ON<br>
                WORLD GONE
            </h1>

            <p>
               • Where Every Journey Has a Soundtrack •
            </p>

        </section>


        <!-- CUSTOM MUSIC PLAYER -->
        <div class="music-player">

            <div class="player-header">
                <span>MUSIC • MOOD • MEMORIES</span>
            </div>


            <div class="player-content">

                <div class="song-image">
                    <img id="songThumbnail" src="" alt="Song">
                </div>


                <div class="song-info">

                    <div id="songTitle" class="song-title">
                        Loading playlist...
                    </div>

                    <div id="songArtist" class="song-artist">
                        YouTube Music
                    </div>

                </div>


                <div class="controls">

                    <button
                        id="previousBtn"
                        class="control-btn"
                        title="Previous"
                    >
                        ⏮
                    </button>


                    <button
                        id="playBtn"
                        class="play-btn"
                        title="Play"
                    >
                        <span id="playIcon">▶</span>
                    </button>


                    <button
                        id="nextBtn"
                        class="control-btn"
                        title="Next"
                    >
                        ⏭
                    </button>

                </div>

            </div>


            <div class="progress-section">

                <span id="currentTime">0:00</span>

                <input
                    type="range"
                    id="progressBar"
                    min="0"
                    max="100"
                    value="0"
                >

                <span id="duration">0:00</span>

            </div>

        </div>

    </main>


    <!--
        YouTube player.
        Minimum 200x200 as required by YouTube IFrame API.
        It is invisible to the user.
    -->
    <div id="youtube-player"></div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        window.PLAYLIST_ID = "PLLiOJ1XeGnAg";
    </script>

    <script src="script.js"></script>

</body>
</html>
